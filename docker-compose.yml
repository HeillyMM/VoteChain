services:
  mariadb:
    image: mariadb:11

    container_name: voting_mariadb

    restart: unless-stopped

    environment:
      MYSQL_ROOT_PASSWORD: root123

    ports:
      - "3306:3306"

    volumes:
      - mariadb_data:/var/lib/mysql
      - ./sivel.sql:/docker-entrypoint-initdb.d/sivel.sql

volumes:
  mariadb_data: