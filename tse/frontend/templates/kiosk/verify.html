{% extends "base.html" %}

{% block title %}Verificar Ciudadano{% endblock %}

{% block content %}

<div class="row justify-content-center">

    <div class="col-md-6">

        <div class="card">

            <div class="card-body">

                <h3 class="text-center mb-4">
                    Verificación de Identidad
                </h3>

                <form>

                    <div class="mb-3">

                        <label>
                            Cédula de Identidad
                        </label>

                        <input
                            type="text"
                            class="form-control">

                    </div>

                    <button
                        class="btn btn-primary w-100">

                        Verificar

                    </button>

                </form>

            </div>

        </div>

    </div>

</div>

{% endblock %}
