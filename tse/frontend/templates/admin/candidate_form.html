{% extends "base.html" %}

{% block title %}
Registrar Candidato
{% endblock %}

{% block content %}

<div class="row justify-content-center">

<div class="col-lg-8">

    <div class="card shadow-sm">

        <div class="card-header bg-primary text-white">
            <h3 class="mb-0">Registro de Candidato</h3>
        </div>

        <div class="card-body">

            <form action="{{ url_for('bp_candidato.create') }}"
                  method="POST"
                  enctype="multipart/form-data">

                <div class="row">

                    <div class="col-md-4 mb-3">
                        <label class="form-label">Nombres</label>
                        <input type="text" name="nombres" class="form-control" required>
                    </div>

                    <div class="col-md-4 mb-3">
                        <label class="form-label">Apellido Paterno</label>
                        <input type="text" name="apellido_paterno" class="form-control" required>
                    </div>

                    <div class="col-md-4 mb-3">
                        <label class="form-label">Apellido Materno</label>
                        <input type="text" name="apellido_materno" class="form-control">
                    </div>

                </div>

                <div class="row">

                    <div class="col-md-4 mb-3">
                        <label class="form-label">Número Lista</label>
                        <input type="number" name="numero_lista" class="form-control" required>
                    </div>

                    <div class="col-md-4 mb-3">
                        <label class="form-label">Sigla Partido</label>
                        <input type="text" name="sigla_partido" class="form-control" required>
                    </div>

                    <div class="col-md-4 mb-3">
                        <label class="form-label">Nombre Partido</label>
                        <input type="text" name="nombre_partido" class="form-control">
                    </div>

                </div>
                
                <div class="mb-3">
                <label class="form-label">Elección</label>

                <select name="eleccion_id" class="form-select" required>
                    <option value="">Seleccione una elección</option>

                    {% for e in elecciones %}
                    <option value="{{ e.id }}">
                        {{ e.titulo }}
                    </option>
                    {% endfor %}

                </select>
            </div>

                <div class="mb-3">
                    <label class="form-label">Propuesta Electoral</label>
                    <textarea name="propuesta_breve"
                              class="form-control"
                              rows="4"></textarea>
                </div>

                <div class="row">

                    <div class="col-md-6 mb-3">
                        <label class="form-label">Foto Candidato</label>
                        <input type="file" name="foto_candidato" class="form-control">
                    </div>

                    <div class="col-md-6 mb-3">
                        <label class="form-label">Logo Partido</label>
                        <input type="file" name="logo_partido" class="form-control">
                    </div>

                </div>

                <div class="mb-3">
                    <label class="form-label">Color Partido</label>
                    <input type="color" name="color_partido" class="form-control form-control-color">
                </div>

                <div class="text-center mt-4">

                    <button type="submit" class="btn btn-success btn-lg">
                        Guardar Candidato
                    </button>

                    <a href="{{ url_for('bp_candidato.index') }}"
                       class="btn btn-secondary btn-lg">
                        Cancelar
                    </a>

                </div>

            </form>

        </div>

    </div>

</div>

</div>

{% endblock %}
