{% extends 'base.html' %}

{% block title %}
Nuevo Recinto
{% endblock %}

{% block content %}

<div class="row justify-content-center">
<div class="col-lg-8">
    <div class="card shadow-sm">
        <div class="card-header">
            <h3 class="mb-0">Registrar Recinto</h3>
        </div>
        <div class="card-body">
            <form method="POST">
                <div class="mb-3">
                    <label class="form-label">Código</label>
                    <input type="text" name="codigo" class="form-control" maxlength="20" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">Nombre</label>
                    <input type="text" name="nombre" class="form-control" maxlength="150" required>
                </div>
                <div class="mb-3">
                    <label class="form-label"> Dirección</label>
                    <input type="text" name="direccion" class="form-control" maxlength="200">
                </div>
                <div class="mb-3"> 
                    <label class="form-label">Municipio</label>
                    <input type="text" name="municipio" class="form-control" maxlength="80" required>
                </div>

                <div class="mb-3">
                <label class="form-label"> Departamento</label>
                    <select name="departamento_id" class="form-select" required>
                        <option value="">Seleccione un departamento</option>
                        {% for departamento in departamentos %}
                            <option value="{{ departamento.id }}">{{ departamento.nombre }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div class="mb-4">
                    <label class="form-label">Total de Mesas</label>
                    <input type="number" name="total_mesas" class="form-control" min="1" value="1" required>
                </div>
                <div class="d-flex justify-content-between">
                    <a href="{{ url_for('bp_recinto.todos_recintos') }}" class="btn btn-secondary"> Cancelar</a>
                    <button type="submit" class="btn btn-primary">Guardar Recinto</button>
                </div>
            </form>
        </div>
    </div>
</div>
</div>
{% endblock %}
