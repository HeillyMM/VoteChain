{% extends 'base.html' %}

{% block title %}
Editar Recinto
{% endblock %}

{% block content %}

<div class="row justify-content-center">
<div class="col-lg-8">
    <div class="card shadow-sm">
        <div class="card-header">
            <h3 class="mb-0">Actualizar Recinto: {{recinto.nombre}}</h3>
        </div>
        <div class="card-body">
            <form action="{{url_for('bp_recinto.editar',recinto_id=recinto.id)}}" method="POST">
                <div class="mb-3">
                    <label class="form-label">Código</label>
                    <input type="text" name="codigo" class="form-control" maxlength="20" value="{{recinto.codigo}}">
                </div>
                <div class="mb-3">
                    <label class="form-label">Nombre</label>
                    <input type="text" name="nombre" class="form-control" maxlength="150" value="{{recinto.nombre}}">
                </div>
                <div class="mb-3">
                    <label class="form-label"> Dirección</label>
                    <input type="text" name="direccion" class="form-control" maxlength="200" value="{{recinto.direccion}}">
                </div>
                <div class="mb-3"> 
                    <label class="form-label">Municipio</label>
                    <input type="text" name="municipio" class="form-control" maxlength="80" value="{{recinto.municipio}}">
                </div>

                <div class="mb-3">
                <label class="form-label"> Departamento</label>
                    <select name="departamento_id" class="form-select">
                        <option value="">Seleccione un departamento</option>
                        {% for departamento in departamentos %}
                            <option value="{{ departamento.id }}" {% if recinto.departamento_id == departamento.id %}selected{% endif %}>{{ departamento.nombre }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div class="mb-4">
                    <label class="form-label">Total de Mesas</label>
                    <input type="number" name="total_mesas" class="form-control" min="1" value="{{recinto.total_mesas}}">
                </div>
                <div class="mb-3">
                <label class="form-label"> Activo</label>
                    <select name="activo" class="form-select">
                        <option value="">Estado de recinto</option>
                            <option value="1" {% if recinto.activo %}selected{% endif %}>Activo</option>
                            <option value="0" {% if not recinto.activo %}selected{% endif %}>Inactivo</option>
                    </select>
                </div>
                <div class="d-flex justify-content-between">
                    <a href="{{ url_for('bp_recinto.todos_recintos') }}" class="btn btn-secondary"> Cancelar</a>
                    <button type="submit" class="btn btn-primary">Actualizar Recinto</button>
                </div>
            </form>
        </div>
    </div>
</div>
</div>
{% endblock %}
