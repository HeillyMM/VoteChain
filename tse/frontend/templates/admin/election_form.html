{% extends "base.html" %}

{% block title %}Nueva Elección{% endblock %}

{% block content %}

<h2 class="fw-bold mb-4">
    Crear Elección
</h2>

<div class="card">

    <div class="card-body">

        <form>

            <div class="mb-3">

                <label class="form-label">
                    Nombre de la Elección
                </label>

                <input
                    type="text"
                    class="form-control">

            </div>

            <div class="mb-3">

                <label class="form-label">
                    Fecha
                </label>

                <input
                    type="date"
                    class="form-control">

            </div>

            <button class="btn btn-primary">

                Guardar

            </button>

        </form>

    </div>

</div>

{% endblock %}
